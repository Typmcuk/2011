<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LessonBoard</title>
<style>
:root{--bg:#f6f3ec;--card:#fffdf8;--ink:#1d1b16;--mu:#6b665a;--ln:#ddd6c6;--ac:#e4572e;--g:#1f6f5c;--ok:#e2f1ea;--bad:#fbe5df;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 Georgia,"Times New Roman",serif}
.mono,code,pre{font-family:ui-monospace,Menlo,Consolas,monospace}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 60px}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 8px}
.logo{font-weight:700;font-size:22px}.logo b{color:var(--ac)}
.hero{padding:22px 0 8px}
.cells{display:flex;gap:6px;margin-bottom:14px}
.cells span{width:44px;height:44px;border:2px solid var(--ink);display:grid;place-items:center;font:600 16px ui-monospace,Menlo,monospace;background:var(--card)}
.cells span:nth-child(2){background:var(--ac);color:#fff;border-color:var(--ac)}
.cells span:nth-child(4){background:var(--g);color:#fff;border-color:var(--g)}
h1{font-size:clamp(34px,7vw,54px);line-height:1.08;margin:0 0 6px;letter-spacing:-.02em}
.mu{color:var(--mu);font-size:15px}
nav{display:flex;gap:0;margin:18px 0 20px;border-bottom:2px solid var(--ink);overflow-x:auto}
nav button{flex:1;font:600 17px Georgia,serif;padding:12px 18px;border:0;background:none;color:var(--mu);cursor:pointer;border-bottom:4px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav button.on{color:var(--ink);border-bottom-color:var(--ac)}
h2{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--ac);margin:26px 0 10px;font-family:ui-monospace,Menlo,monospace}
.card{background:var(--card);border:1.5px solid var(--ln);border-radius:12px;padding:14px 16px;margin:10px 0}
.bar{height:10px;background:var(--ln);border-radius:6px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--g);transition:width .3s}
.t{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px dashed var(--ln)}
.t input{width:24px;height:24px;accent-color:var(--g);flex:none}
.t span{flex:1}.t.d span{text-decoration:line-through;color:var(--mu)}
.x{border:0;background:none;color:var(--mu);font-size:22px;cursor:pointer;padding:4px 10px;border-radius:8px}.x:hover{background:var(--bad);color:var(--ac)}
.add{display:flex;gap:8px;margin-top:14px}
label{display:block;font-weight:700;margin:0 0 4px;font-size:16px}
textarea{width:100%;min-height:80px;font:inherit;font-size:17px;padding:11px 13px;border:1.5px solid var(--ln);border-radius:10px;background:var(--card);color:var(--ink)}textarea:focus{outline:2px solid var(--ac)}
input[type=text]{width:100%;flex:1;min-width:0;font:inherit;font-size:17px;padding:11px 13px;border:1.5px solid var(--ln);border-radius:10px;background:var(--card);color:var(--ink)}
input[type=text]:focus{outline:2px solid var(--ac)}
.btn{font:600 16px Georgia,serif;background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:11px 18px;cursor:pointer}
.btn.a{background:var(--ac);color:#fff}
details{background:var(--card);border:1.5px solid var(--ln);border-radius:12px;margin:10px 0;padding:0 16px}
summary{cursor:pointer;font-weight:700;padding:14px 0;font-size:19px}
details[open] summary{color:var(--ac)}
details p{margin:0 0 12px}
pre{background:#1d1b16;color:#f2eee2;padding:12px 14px;border-radius:10px;overflow-x:auto;font-size:15px;line-height:1.5;margin:0 0 14px}
.tag{display:inline-block;font:600 13px ui-monospace,Menlo,monospace;background:var(--ok);color:var(--g);padding:2px 9px;border-radius:99px}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:17px;padding:11px 14px;margin:6px 0;border:1.5px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:10px;cursor:pointer}
.opt.sel{border-color:var(--ac);box-shadow:0 0 0 3px rgba(228,87,46,.2)}
.opt.r{background:var(--ok);border-color:var(--g)}.opt.w{background:var(--bad);border-color:var(--ac)}
.score{font:700 38px ui-monospace,Menlo,monospace;color:var(--g)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 16px Georgia,serif;padding:9px 16px;border:1.5px solid var(--ln);border-radius:99px;background:var(--card);color:var(--ink);cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--ac);margin-top:8px}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.note{padding:12px;border-radius:4px 4px 16px 4px;box-shadow:0 4px 10px rgba(0,0,0,.14)}
.note label,.note textarea{color:#2a2616}.note label{font-size:14px}
.note textarea{background:rgba(255,255,255,.55);border:0;min-height:120px}
.ticket{border:2px dashed var(--ac);border-radius:14px;padding:14px 16px;background:var(--card)}
.hid{display:none}
.emo{display:flex;gap:8px;justify-content:center}
.eb{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);border:2px solid var(--ln);border-radius:16px;padding:10px 2px;flex:1 1 0;min-width:0;cursor:pointer;color:var(--ink);font:inherit;text-align:center}
.eb .e{font-size:clamp(30px,9vw,44px);line-height:1;display:block;transition:transform .2s}.eb small{font-size:clamp(10px,2.7vw,13px);color:var(--mu);overflow-wrap:anywhere}
.eb:hover .e{transform:scale(1.25) rotate(-6deg)}.eb.on{border-color:var(--ac);background:var(--ok);box-shadow:0 0 0 3px rgba(228,87,46,.2)}
.eb.on .e{animation:pop .6s ease,wob 2.2s ease-in-out .6s infinite}
.big{font-size:84px;line-height:1.1;margin:4px 0;animation:bob 2.4s ease-in-out infinite}.big.pop{animation:pop .6s ease,bob 2.4s ease-in-out .6s infinite}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.3);opacity:1}100%{transform:scale(1)}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.deck{background:var(--card);border:1.5px solid var(--ln);border-radius:12px;padding:8px;margin:10px 0 16px}.deck img{width:100%;aspect-ratio:16/9;object-fit:contain;background:#fff;border-radius:8px;display:block;transition:opacity .15s}.deck img.ld{opacity:.4}.dkbar{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px}.deck:fullscreen{background:#111;display:flex;flex-direction:column;justify-content:center;padding:12px}.deck:fullscreen img{max-height:calc(100vh - 110px)}
@media print{body *{visibility:hidden}#poster,#poster *{visibility:visible}#poster{position:fixed;left:0;top:0;width:100%;border:0;background:#fff;color:#000}}
audio{width:100%}video{width:100%;border-radius:10px;display:block}iframe.yt{width:100%;aspect-ratio:16/9;border:0;border-radius:10px}
.dz{display:block;margin-top:10px;border:2px dashed var(--ln);border-radius:12px;padding:18px;text-align:center;color:var(--mu);cursor:pointer;font-size:16px}.dz.hov{border-color:var(--ac);background:var(--ok)}.th{height:56px;width:auto;display:inline-block;margin:8px 6px 0 0;border-radius:6px}
figure{margin:10px 0}img{max-width:100%;border-radius:10px;display:block}figcaption{font-size:14px;margin-top:4px}details a,.card a{color:var(--ac)}
.sp{filter:blur(7px);cursor:pointer;user-select:none;transition:filter .2s}.sp.on{filter:none;user-select:auto}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};

const API="https://script.google.com/macros/s/AKfycbwe_k4W_NoET5Cnvz2XTMatAdZSmubWjOtvqk6-O-8pKZf8NOLkh-gd_50n79cvWtT9/exec"; // адрес веб-приложения Google Apps Script (заканчивается на /exec)
let reg=load("lb_reg",{name:"",grp:""}),R=load("lb_r",{}),SENT=load("lb_sent",null),TP=load("lb_pin",""),JR=[],JM="",PINERR="";
let tab=load("lb_tab","lesson"),ans={},sub=false,TLOCK=false;try{localStorage.removeItem("lb_td")}catch(e){}
const DEF={"v": 0, "topic": "Операторы выбора if, switch", "goals": ["Изучить операторы выбора if, if...else, else if и switch и понять, когда применять каждый из них", "Освоить условия с операторами сравнения и логическими операторами (&&, ||, !), оператор break и ветку default", "Применять тернарный оператор и находить типичные ошибки в ветвлениях"], "lec": [{"t": "Что такое операторы выбора", "b": "Обычно программа выполняется строка за строкой сверху вниз. Операторы выбора (ветвления) позволяют программе принимать решение: выполнить один блок кода или другой в зависимости от условия.\n\nВ JavaScript для выбора используются:\n\n• if и if...else: выбор по условию (истина или ложь);\n\n• else if: цепочка из нескольких условий;\n\n• switch: выбор по конкретному значению переменной;\n\n• тернарный оператор ? : компактная запись простого выбора.\n\nУсловие в таких операторах всегда превращается в логическое значение: true (истина) или false (ложь)."}, {"t": "Оператор if", "b": "Оператор if выполняет блок кода только тогда, когда условие в скобках истинно. Если условие ложно, блок пропускается.\n\n```\nlet age = 20;\nif (age >= 18) {\n  console.log(\"Доступ разрешён\");\n}\nconsole.log(\"Конец программы\");   // выполнится в любом случае\n```\n\nЕсли внутри блока одна команда, фигурные скобки можно опустить, но лучше их всегда ставить: так код понятнее и безопаснее.\n\nЕсли в условии стоит не логическое значение, JavaScript приводит его к логическому. Ложными считаются: 0, пустая строка \"\", null, undefined, NaN и false. Всё остальное (в том числе \"0\", \"false\" и пустой массив []) считается истинным.\n\n```\nlet name = \"\";\nif (name) {\n  console.log(\"Привет, \" + name);\n}   // имя пустое (ложь), блок не выполнится\n```"}, {"t": "if...else и else if", "b": "Блок else выполняется, когда условие if ложно. Так получается выбор из двух вариантов:\n\n```\nlet n = 7;\nif (n % 2 === 0) {\n  console.log(\"Чётное\");\n} else {\n  console.log(\"Нечётное\");   // выведется это\n}\n```\n\nКогда вариантов больше двух, используют цепочку else if. Условия проверяются сверху вниз, выполняется только первая ветка с истинным условием, остальные пропускаются.\n\n```\nlet score = 82;\nif (score >= 90) {\n  console.log(\"Оценка 5\");\n} else if (score >= 70) {\n  console.log(\"Оценка 4\");   // выведется это\n} else if (score >= 50) {\n  console.log(\"Оценка 3\");\n} else {\n  console.log(\"Оценка 2\");\n}\n```\n\nПорядок проверок важен: если поставить условие score >= 50 первым, то для 82 баллов выполнится именно оно, а ветки для «5» и «4» уже не проверятся."}, {"t": "Условия: сравнение и логические операторы", "b": "В условиях используют операторы сравнения: ===, !==, >, <, >=, <= и логические операторы: && (И), || (ИЛИ), ! (НЕ).\n\n```\nlet x = 5;\nconsole.log(x === 5);          // true\nconsole.log(x !== 5);          // false\nconsole.log(x > 3 && x < 10);  // true (оба условия верны)\nconsole.log(x < 3 || x > 4);   // true (хотя бы одно верно)\nconsole.log(!(x > 3));         // false\n```\n\nОператор === сравнивает значение и тип без приведения типов, а == перед сравнением приводит типы. Поэтому 5 == \"5\" даёт true, а 5 === \"5\" даёт false. Рекомендуется всегда использовать ===.\n\nДиапазон проверяют двумя условиями, соединёнными через &&:\n\n```\nif (x >= 1 && x <= 10) {\n  console.log(\"x от 1 до 10\");\n}\n// Запись 1 <= x <= 10 работает неверно!\n```"}, {"t": "Оператор switch", "b": "Оператор switch удобен, когда нужно выбрать действие по конкретному значению переменной. Он сравнивает значение с каждым case через строгое равенство (===).\n\n```\nlet day = 3;\nswitch (day) {\n  case 1:\n    console.log(\"Понедельник\");\n    break;\n  case 2:\n    console.log(\"Вторник\");\n    break;\n  case 3:\n    console.log(\"Среда\");     // выведется это\n    break;\n  default:\n    console.log(\"Другой день\");\n}\n```\n\n• case: вариант значения, с которым сравнивается выражение;\n\n• break: выход из switch. Без него выполнение «проваливается» в следующий case, даже если тот не совпал;\n\n• default: выполняется, если ни один case не подошёл (необязательная часть).\n\nНесколько значений можно объединить, опустив break между ними:\n\n```\nswitch (day) {\n  case 6:\n  case 7:\n    console.log(\"Выходной\");\n    break;\n  default:\n    console.log(\"Рабочий день\");\n}\n```"}, {"t": "Тернарный оператор и выбор между if и switch", "b": "Тернарный оператор записывает простой выбор из двух значений в одну строку: условие ? значение_если_истина : значение_если_ложь.\n\n```\nlet age = 20;\nlet status = age >= 18 ? \"взрослый\" : \"ребёнок\";\nconsole.log(status);   // взрослый\n```\n\nКогда что использовать:\n\n• if...else: когда проверяются диапазоны и сложные условия (x > 10, a && b);\n\n• switch: когда одна переменная сравнивается с несколькими точными значениями (номер дня, команда меню, код ответа);\n\n• тернарный оператор: когда нужно быстро выбрать одно из двух значений для переменной.\n\nЛюбой switch можно переписать через цепочку else if, но для длинного списка точных значений switch читается лучше."}, {"t": "Типичные ошибки", "b": "• = вместо === в условии: запись if (x = 5) не сравнивает, а присваивает, и условие всегда истинно, потому что результат равен 5;\n\n• забытый break в switch: выполнение переходит в следующие case, и на экран попадают лишние сообщения;\n\n• точка с запятой после условия: запись if (x > 5); { ... } заканчивает if пустой командой, и блок в фигурных скобках выполняется всегда;\n\n• сравнение разных типов в switch: для switch (\"5\") ветка case 5 не сработает, потому что \"5\" !== 5;\n\n• неверный порядок в else if: более общее условие, поставленное раньше частного, «перехватывает» значения;\n\n• цепочка сравнений 0 < n < 3: она вычисляется как (0 < n) < 3, то есть true < 3, и результат оказывается неверным. Нужно писать n > 0 && n < 3."}], "quiz": [{"q": "Какой оператор выполняет блок кода только если условие истинно?", "o": ["while", "const", "function", "if"], "a": 3}, {"q": "Что выведется: let x = 7; if (x > 10) { console.log(\"A\"); } else { console.log(\"B\"); } ?", "o": ["A", "B", "A и B", "Ничего"], "a": 1}, {"q": "Какое из значений считается ложным в условии if?", "o": ["Строка \"0\"", "Пустой массив []", "Число 0", "Строка \"false\""], "a": 2}, {"q": "Когда выполняется блок else?", "o": ["Когда условие if ложно", "Всегда после if", "Одновременно с if", "Когда в программе есть ошибка"], "a": 0}, {"q": "Что выведется: let t = 15; if (t < 0) console.log(\"Мороз\"); else if (t < 20) console.log(\"Прохладно\"); else console.log(\"Тепло\"); ?", "o": ["Мороз", "Прохладно", "Тепло", "Прохладно и Тепло"], "a": 1}, {"q": "Сколько веток выполнится в цепочке if...else if...else, если истинны сразу несколько условий?", "o": ["Все истинные", "Ни одной", "Только последняя", "Только первая с истинным условием"], "a": 3}, {"q": "Как правильно записать условие «x от 1 до 10 включительно»?", "o": ["1 <= x <= 10", "x >= 1 && x <= 10", "x >= 1 || x <= 10", "x > 1 & x < 10"], "a": 1}, {"q": "Чем === отличается от == ?", "o": ["Ничем", "== сравнивает строже", "=== сравнивает без приведения типов", "=== присваивает значение"], "a": 2}, {"q": "Что делает break в операторе switch?", "o": ["Останавливает всю программу", "Переходит к default", "Повторяет текущий case", "Выходит из switch, не выполняя следующие case"], "a": 3}, {"q": "Когда выполняется ветка default в switch?", "o": ["Всегда первой", "Если ни один case не совпал", "Если совпал первый case", "Только после break"], "a": 1}, {"q": "Что выведется: let n = 2; switch (n) { case 1: log(\"a\"); case 2: log(\"b\"); case 3: log(\"c\"); break; default: log(\"d\"); } ?", "o": ["b", "b и c", "c", "b, c и d"], "a": 1}, {"q": "Почему для switch (\"5\") ветка case 5 не сработает?", "o": ["switch сравнивает строго (===), а \"5\" и 5 имеют разные типы", "switch работает только со строками", "Это синтаксическая ошибка", "Числа в case нужно писать в кавычках"], "a": 0}, {"q": "Что означает запись case 6: case 7: console.log(\"Выходной\"); break; ?", "o": ["Это ошибка", "Код выполнится только для 7", "Один и тот же код выполнится и для 6, и для 7", "Код выполнится только для 6"], "a": 2}, {"q": "Что выведется: let a = 5; if (a > 3) console.log(\"1\"); if (a > 4) console.log(\"2\"); else console.log(\"3\"); ?", "o": ["1", "1 и 2", "2", "1 и 3"], "a": 1}, {"q": "Чему равна r: let age = 20; let r = age >= 18 ? \"взрослый\" : \"ребёнок\"; ?", "o": ["\"взрослый\"", "\"ребёнок\"", "true", "undefined"], "a": 0}], "tasks": [{"t": "Вопросы по технике безопасности", "b": "Откройте игру-рандомайзер по технике безопасности: [Открыть игру по ТБ](Game5.html). Нажмите «Запустить рандомайзер», ответьте на выпавший вопрос и сверьтесь с ответом.\n\n**Критерии:** правильно отвечает на вопрос по правилам безопасной работы за компьютером."}, {"t": "Подготовка к практической работе", "b": "Откройте консоль браузера (клавиша F12, вкладка Console) или создайте файл index.html и пишите код в теге script. Результаты выводите командой console.log().\n\nПеред каждым ответом проверяйте код в консоли и запоминайте, что получилось и почему."}, {"t": "Интерактивное задание LearningApps: соотнесите конструкции с назначением", "b": "Откройте интерактивное задание и соотнесите конструкции операторов выбора с их назначением: [Открыть задание на LearningApps](https://learningapps.org/watch?v=pz26wnv2a26)\n\nПеретаскивайте элементы и нажимайте кнопку проверки. Если есть ошибки, исправьте их и проверьте ещё раз.\n\n**Критерии:** верно сопоставляет конструкции if, if...else, else if, switch, break, default и тернарный оператор с их назначением."}, {"t": "Задание №1: Определите значения (знание и понимание, оценка «3»)", "b": "**Фрагмент 1.**\n\n```\nlet a = 12;\nif (a % 2 === 0) {\n  console.log(\"чётное\");\n} else {\n  console.log(\"нечётное\");\n}\n```\n\n**Фрагмент 2.**\n\n```\nlet day = 3;\nswitch (day) {\n  case 1:\n    console.log(\"Пн\");\n    break;\n  case 2:\n    console.log(\"Вт\");\n    break;\n
